<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Forest Ecosystems Project</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css">
<style>
  :root { --bg:#10170f; --panel:rgba(16,23,15,.88); --accent:#c9a45c; --text:#f3efe4; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: Georgia, "Times New Roman", serif; }
  .screen { position:fixed; inset:0; display:none; }
  .screen.active { display:block; }

  .panel { position:absolute; background:var(--panel); padding:20px 26px; border-radius:10px;
    backdrop-filter: blur(6px); max-width:460px; }
  .panel h1, .panel h2 { margin:0 0 8px; font-weight:normal; }
  .panel p { margin:0; line-height:1.5; }

  button.btn { font:inherit; font-size:1.05rem; color:var(--bg); background:var(--accent);
    border:0; border-radius:999px; padding:12px 24px; cursor:pointer; }
  button.btn:hover, button.btn:focus-visible { filter:brightness(1.12); outline:2px solid #fff; outline-offset:2px; }
  button.ghost { background:transparent; color:var(--text); border:1px solid rgba(255,255,255,.5); }

  /* welcome */
  #welcome-panel { top:20px; left:20px; }
  #chooser { position:absolute; display:none; background:var(--panel); border-radius:10px; padding:14px 18px; z-index:5; }
  #chooser p { margin:0 0 8px; font-size:.95rem; }
  #chooser button { display:block; width:100%; margin:6px 0 0; }

  /* forest */
  #forest { background:#0a0f09; }
  #panorama { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #forest-title { top:20px; left:20px; }
  #forest-actions { position:absolute; left:20px; bottom:28px; display:flex; flex-direction:column; gap:12px; align-items:flex-start; }
  #forest-actions .btn, #center-action .btn { opacity:0; transform:translateY(12px); pointer-events:none;
    transition:opacity .9s ease, transform .9s ease; }
  #forest-actions .btn.show, #center-action .btn.show { opacity:1; transform:none; pointer-events:auto; }
  #center-action { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; }
  #center-action .btn { font-size:1.3rem; padding:16px 34px; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #welcome-note { margin-top:8px; font-size:.8rem; opacity:.65; }
  #top-right { position:absolute; top:20px; right:20px; display:flex; gap:10px; }
  #novideo { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:rgba(255,255,255,.4); font-size:1.1rem; text-align:center; padding:20px;
    background: radial-gradient(circle at 50% 60%, #1f3a22, #0a0f09 70%); }

  #stories { position:absolute; top:0; right:0; bottom:0; width:min(440px,100%); background:var(--panel);
    padding:22px; overflow:auto; transform:translateX(100%); transition:transform .5s ease; z-index:4; }
  #stories.open { transform:none; }
  #stories h2 { margin:0 0 4px; font-weight:normal; }
  #story-list { list-style:none; padding:0; margin:14px 0; }
  #story-list li { margin:0 0 8px; }
  #story-list button { width:100%; text-align:left; font:inherit; color:var(--text); background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:10px 12px; cursor:pointer; }
  #story-list button[aria-current="true"] { border-color:var(--accent); }
  #story-list small { display:block; opacity:.7; }
  #story-player { width:100%; border-radius:8px; background:#000; display:none; }
  #story-caption { font-size:.95rem; line-height:1.5; margin-top:10px; }

  /* risk */
  #risk-map { position:absolute; inset:0; }
  #risk-panel { top:20px; left:60px; }
  #risk-panel .btn { margin-top:14px; }
  #risk-note { margin-top:8px; font-size:.95rem; opacity:.9; }
  #risk-source { margin-top:10px; font-size:.8rem; opacity:.6; }
  .esri-view .esri-ui-top-left { top:20px; }
</style>
</head>
<body>

<!-- Screen 1: welcome + territory map -->
<section id="welcome" class="screen" aria-label="Welcome">
  <div id="welcome-map" style="position:absolute;inset:0"></div>
  <div id="welcome-panel" class="panel">
    <h1 id="welcome-title"></h1>
    <p id="welcome-text"></p>
    <p id="welcome-note"></p>
  </div>
  <div id="chooser" role="dialog" aria-label="Choose territory"></div>
</section>

<!-- Screen 2: forest panorama + stories -->
<section id="forest" class="screen" aria-label="Forest">
  <video id="panorama" autoplay muted loop playsinline></video>
  <div id="novideo">No panorama video set for this territory yet.<br>Add one in content.json.</div>
  <div id="forest-title" class="panel"><h2 id="forest-name"></h2></div>
  <div id="top-right">
    <button class="btn ghost" id="sound-btn" type="button">Sound on</button>
    <button class="btn ghost" id="back-map" type="button">Back to map</button>
  </div>
  <div id="center-action">
    <button class="btn" id="stories-btn" type="button">Listen to stories about this forest</button>
  </div>
  <div id="forest-actions">
    <button class="btn" id="risk-btn" type="button">Learn what is at risk</button>
  </div>
  <aside id="stories" aria-label="Stories">
    <button class="btn ghost" id="stories-close" type="button" style="float:right;padding:6px 14px">Close</button>
    <h2>Stories from the forest</h2>
    <ul id="story-list"></ul>
    <video id="story-player" controls playsinline></video>
    <iframe id="story-embed" title="Story video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
      style="display:none;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000"></iframe>
    <p id="story-caption"></p>
  </aside>
</section>

<!-- Screen 3: what is at risk -->
<section id="risk" class="screen" aria-label="What is at risk">
  <div id="risk-map"></div>
  <div id="risk-panel" class="panel">
    <h2 id="risk-title"></h2>
    <p id="risk-note"></p>
    <p id="risk-source"></p>
    <button class="btn ghost" id="risk-back" type="button">Back to the forest</button>
  </div>
</section>

<script src="https://js.arcgis.com/4.30/"></script>
<script>
require([
  "esri/config", "esri/Map", "esri/Basemap", "esri/views/MapView", "esri/layers/GeoJSONLayer",
  "esri/layers/FeatureLayer", "esri/layers/TileLayer", "esri/geometry/geometryEngine"
], function (esriConfig, Map, Basemap, MapView, GeoJSONLayer, FeatureLayer, TileLayer, geometryEngine) {

  const $ = (id) => document.getElementById(id);
  let content, S, currentName = null;
  let welcomeView = null, riskView = null, riskTerritoryLayer = null, riskTimberView = null;

  // ---------- helpers ----------
  function makeLayer(cfg, opts) {
    // cfg: {type:"geojson"|"featurelayer", url:"..."}
    // Swap in an ArcGIS Online feature layer by changing the URL in content.json.
    const Cls = cfg.type === "featurelayer" ? FeatureLayer : GeoJSONLayer;
    return new Cls(Object.assign({ url: cfg.url }, opts));
  }
  // If a tile service URL is given (e.g. USGS, free, no key) use it as the basemap;
  // otherwise fall back to an Esri basemap id (which needs an API key).
  function makeBasemap(tileUrl, esriId) {
    if (tileUrl) return new Basemap({ baseLayers: [new TileLayer({ url: tileUrl })] });
    return esriId;
  }
  function escSql(s) { return String(s).replace(/'/g, "''"); }
  function tinfo(name) { return (content.territories || {})[name] || {}; }
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
  }

  // ---------- routing (hash based so the browser Back button works) ----------
  function route() {
    const [, screen, rawName] = location.hash.split("/");
    const name = rawName ? decodeURIComponent(rawName) : null;
    stopForestMedia();
    if (screen === "forest" && name) openForest(name);
    else if (screen === "risk" && name) openRisk(name);
    else openWelcome();
  }
  window.addEventListener("hashchange", route);
  function go(hash) { location.hash = hash; }

  // ---------- screen 1: welcome ----------
  function openWelcome() {
    show("welcome");
    $("chooser").style.display = "none";
    $("welcome-title").textContent = S.welcomeTitle;
    $("welcome-text").textContent = S.welcomeText;
    $("welcome-note").textContent = S.welcomeNote || "";
    if (welcomeView) return;

    const territories = makeLayer(S.territoryLayer, {
      title: "Territories",
      outFields: ["*"],
      labelsVisible: true,
      labelingInfo: [{
        labelExpressionInfo: { expression: "$feature." + S.nameField },
        labelPlacement: "always-horizontal",
        symbol: { type: "text", color: "#ffffff", haloColor: "#10170f", haloSize: 2.5,
                  font: { family: "Georgia", size: 18, weight: "bold" } }
      }],
      popupEnabled: false,
      renderer: {
        type: "simple",
        symbol: { type: "simple-fill", color: [201, 164, 92, 0.28],
                  outline: { color: [201, 164, 92, 1], width: 1.5 } }
      }
    });
    // Optional: show only some territories, e.g. "Name IN ('Lummi','Skokomish')"
    if (S.territoryWhere) territories.definitionExpression = S.territoryWhere;
    welcomeView = new MapView({
      container: "welcome-map",
      map: new Map({ basemap: makeBasemap(S.basemapUrl, S.basemap || "arcgis/topographic"), layers: [territories] }),
      center: S.startCenter || [-120.8, 47.4],
      zoom: S.startZoom || 7,
      popupEnabled: false,
      ui: { components: ["zoom"] }
    });

    const hit = async (event) => {
      const res = await welcomeView.hitTest(event, { include: [territories] });
      const names = [...new Set(res.results.map((r) => r.graphic.attributes[S.nameField]).filter(Boolean))];
      return { names, event };
    };

    welcomeView.on("pointer-move", async (e) => {
      const { names } = await hit(e);
      $("welcome-map").style.cursor = names.length ? "pointer" : "default";
    });

    welcomeView.on("click", async (e) => {
      const { names } = await hit(e);
      $("chooser").style.display = "none";
      if (names.length === 1) go("/forest/" + encodeURIComponent(names[0]));
      else if (names.length > 1) showChooser(names, e.x, e.y);
    });
  }

  // Territories overlap in Washington, so a click can land in more than one.
  function showChooser(names, x, y) {
    const box = $("chooser");
    box.innerHTML = "";
    const p = document.createElement("p");
    p.textContent = "This place is within more than one territory. Choose one:";
    box.appendChild(p);
    names.forEach((n) => {
      const b = document.createElement("button");
      b.className = "btn ghost";
      b.type = "button";
      b.textContent = tinfo(n).displayName || n;
      b.onclick = () => go("/forest/" + encodeURIComponent(n));
      box.appendChild(b);
    });
    box.style.display = "block";
    box.style.left = Math.min(x, window.innerWidth - 300) + "px";
    box.style.top = Math.min(y, window.innerHeight - 40 - names.length * 50) + "px";
  }

  // ---------- screen 2: forest ----------
  let storiesTimer = null;
  function stopForestMedia() {
    clearTimeout(storiesTimer);
    const pano = $("panorama"), sp = $("story-player");
    pano.pause(); sp.pause();
    $("story-embed").removeAttribute("src");
  }

  function openForest(name) {
    currentName = name;
    show("forest");
    const info = tinfo(name);
    $("forest-name").textContent = info.displayName || name;

    // reset UI state
    $("stories").classList.remove("open");
    $("stories-btn").classList.remove("show");
    $("risk-btn").classList.remove("show");
    $("story-player").style.display = "none";
    $("story-player").removeAttribute("src");
    $("story-embed").style.display = "none";
    $("story-caption").textContent = "";

    // panorama (must be muted for browsers to allow autoplay)
    const pano = $("panorama");
    $("sound-btn").textContent = "Sound on";
    if (info.panoramaVideo) {
      $("novideo").style.display = "none";
      pano.style.display = "block";
      pano.muted = true;
      pano.src = info.panoramaVideo;
      pano.play().catch(() => {});
    } else {
      pano.removeAttribute("src");
      pano.style.display = "none";
      $("novideo").style.display = "flex";
    }

    // build story list
    const list = $("story-list");
    list.innerHTML = "";
    (info.stories || []).forEach((st, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = st.title || "Story " + (i + 1);
      if (st.speaker) {
        const sm = document.createElement("small");
        sm.textContent = st.speaker;
        b.appendChild(sm);
      }
      b.onclick = () => playStory(st, b);
      li.appendChild(b);
      list.appendChild(li);
    });
    if (!(info.stories || []).length) {
      const li = document.createElement("li");
      li.textContent = "No stories have been added for this territory yet.";
      list.appendChild(li);
    }

    // the "listen to stories" button fades in a few seconds after the video starts
    clearTimeout(storiesTimer);
    storiesTimer = setTimeout(() => $("stories-btn").classList.add("show"), (S.storiesButtonDelaySeconds ?? 4) * 1000);
  }

  function playStory(st, btn) {
    document.querySelectorAll("#story-list button").forEach((b) => b.removeAttribute("aria-current"));
    btn.setAttribute("aria-current", "true");
    const sp = $("story-player"), em = $("story-embed");
    em.style.display = "none"; em.removeAttribute("src");
    $("panorama").muted = true; $("sound-btn").textContent = "Sound on";
    if (st.youtube) {
      // accepts a bare video ID or a full YouTube link
      const id = String(st.youtube).replace(/^.*(?:v=|youtu\.be\/|embed\/)/, "").split(/[?&]/)[0];
      sp.pause(); sp.style.display = "none";
      em.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) + "?rel=0";
      em.style.display = "block";
    } else if (st.video) {
      sp.style.display = "block";
      sp.src = st.video;
      if (st.captions) {
        sp.querySelectorAll("track").forEach((t) => t.remove());
        const t = document.createElement("track");
        t.kind = "captions"; t.src = st.captions; t.default = true; t.label = "Captions";
        sp.appendChild(t);
      }
      sp.play().catch(() => {});
    } else {
      sp.style.display = "none";
    }
    $("story-caption").textContent = st.description || "";
    $("risk-btn").classList.add("show");
  }

  $("stories-btn").onclick = () => {
    $("stories").classList.add("open");
    $("stories-btn").classList.remove("show");
    $("risk-btn").classList.add("show");
  };
  $("stories-close").onclick = () => {
    $("stories").classList.remove("open");
    $("story-player").pause();
    $("story-embed").removeAttribute("src");
    $("story-embed").style.display = "none";
    $("stories-btn").classList.add("show");
  };
  $("sound-btn").onclick = () => {
    const pano = $("panorama");
    pano.muted = !pano.muted;
    $("sound-btn").textContent = pano.muted ? "Sound on" : "Sound off";
  };
  $("back-map").onclick = () => go("/");
  $("risk-btn").onclick = () => go("/risk/" + encodeURIComponent(currentName));

  // ---------- screen 3: what is at risk ----------
  async function openRisk(name) {
    currentName = name;
    show("risk");
    const info = tinfo(name);
    $("risk-title").textContent = "What is at risk in " + (info.displayName || name);
    $("risk-note").textContent = info.riskNote || "";
    $("risk-source").textContent = S.timberSalesSource ? "Timber sale data: " + S.timberSalesSource : "";

    const expr = `${S.nameField} = '${escSql(name)}'`;

    if (!riskView) {
      riskTerritoryLayer = makeLayer(S.territoryLayer, {
        title: "Territory", outFields: ["*"], popupEnabled: false,
        renderer: { type: "simple",
          symbol: { type: "simple-fill", color: [0, 0, 0, 0],
                    outline: { color: [201, 164, 92, 1], width: 2.5 } } }
      });
      const timber = makeLayer(S.timberSalesLayer, {
        title: "Timber sales", outFields: ["*"], defaultPopupTemplateEnabled: true,
        renderer: { type: "simple",
          symbol: { type: "simple-fill", color: [200, 50, 40, 0.65],
                    outline: { color: [120, 20, 20, 1], width: 1 } } }
      });
      riskView = new MapView({
        container: "risk-map",
        map: new Map({ basemap: makeBasemap(S.riskBasemapUrl, S.riskBasemap || "arcgis/imagery"), layers: [riskTerritoryLayer, timber] }),
        ui: { components: ["zoom"] }
      });
      riskView.timberLayer = timber;
      await riskView.when();
      riskTimberView = await riskView.whenLayerView(timber);
    }

    riskTerritoryLayer.definitionExpression = expr;
    const q = riskTerritoryLayer.createQuery();
    q.where = expr; q.returnGeometry = true;
    const res = await riskTerritoryLayer.queryFeatures(q);
    if (!res.features.length) return;

    // show only timber sales that fall inside this territory
    // a tribe may have several polygons in the layer, so merge them into one shape
    const geoms = res.features.map((f) => f.geometry);
    const geom = geoms.length > 1 ? geometryEngine.union(geoms) : geoms[0];
    riskTimberView.featureEffect = {
      filter: { geometry: geom, spatialRelationship: "intersects" },
      excludedEffect: "opacity(0%)"
    };
    riskView.goTo(res.features.map((f) => f.geometry.extent).reduce((a, b) => a.union(b)).expand(1.15));
  }
  $("risk-back").onclick = () => go("/forest/" + encodeURIComponent(currentName));

  // ---------- start ----------
  fetch("content.json")
    .then((r) => r.json())
    .then((c) => {
      content = c; S = c.settings;
      // ArcGIS basemaps need an API key (set "apiKey" in content.json)
      if (S.apiKey) esriConfig.apiKey = S.apiKey;
      else if (!S.basemapUrl || !S.riskBasemapUrl) console.warn("No apiKey and no basemap URL set: ArcGIS may ask visitors to sign in.");
      route();
    })
    .catch((err) => {
      document.body.innerHTML = "<p style='padding:30px'>Could not load content.json. " +
        "Open this page through a web server (see README), not by double-clicking the file.</p>";
      console.error(err);
    });
});
</script>
</body>
</html>
